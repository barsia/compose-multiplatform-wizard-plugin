name: Bug Report
description: Report a bug or issue with the Compose Multiplatform Wizard plugin
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version
      description: Version of Compose Multiplatform Wizard plugin
      placeholder: "0.1.0"
    validations:
      required: false

  - type: input
    id: ide
    attributes:
      label: IDE
      description: Which IDE and version are you using?
      placeholder: "e.g., Android Studio Koala 2024.1.1 or IntelliJ IDEA 2024.2.4"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the issue you encountered
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected Result
      description: What did you expect to happen?
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual Result
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screencast
      description: If applicable, drag and drop screenshots or screencast here
      placeholder: Paste screenshots or screencast here...
    validations:
      required: false

