<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="title desc">
  <title id="title">Compose Icon</title>
  <desc id="desc">Regular hexagon with a center hexagon, filled with a blue-to-purple gradient. Clean SVG with a proper viewBox for IDE scaling.</desc>
  <defs>
    <linearGradient id="g" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49C0FF"/>
      <stop offset="1" stop-color="#6C4CFF"/>
    </linearGradient>
  </defs>
  <!-- Outer hexagon -->
  <polygon fill="url(#g)" points="56,8 97.6,32 97.6,80 56,104 14.4,80 14.4,32"/>
  <!-- Inner hexagon (hole visualized by black fill to match original look) -->
  <polygon fill="#000000" points="56,36 73.3,46 73.3,66 56,76 38.7,66 38.7,46"/>
</svg>
