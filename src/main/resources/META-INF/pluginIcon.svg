<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-labelledby="title desc">
  <title id="title">Compose Multiplatform Wizard Icon</title>
  <desc id="desc">Outline folder with Compose logo representing new Compose Multiplatform project creation</desc>
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD580"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
    <linearGradient id="composeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49C0FF"/>
      <stop offset="100%" stop-color="#6C4CFF"/>
    </linearGradient>
  </defs>

  <!-- Folder -->
  <path fill="url(#folderGradient)" d="M16,28 Q16,24 20,24 L50,24 L58,32 L92,32 Q96,32 96,36 L96,84 Q96,88 92,88 L20,88 Q16,88 16,84 Z"/>

  <!-- Compose hexagon logo inside folder -->
  <g transform="translate(56, 58)">
    <!-- Outer hexagon with gradient (authentic Compose branding) -->
    <polygon fill="url(#composeGradient)" points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"/>
    <!-- Inner hexagon black solid (authentic Compose logo) -->
    <polygon fill="#000000" points="0,-9.5 8.2,-4.75 8.2,4.75 0,9.5 -8.2,4.75 -8.2,-4.75"/>
  </g>
  <!-- Plus icon to indicate "create new" action -->
  <circle cx="83" cy="30" r="10" fill="url(#composeGradient)" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="83" y1="25" x2="83" y2="35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="30" x2="88" y2="30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
