  </g>

  <!-- Central Compose Logo -->
  <g transform="translate(256, 256)">
    <g transform="scale(1.5)">
        <polygon fill="url(#compose-gradient)" points="56,8 97.6,32 97.6,80 56,104 14.4,80 14.4,32" transform="translate(-56, -56)"/>
        <polygon fill="#000000" points="56,36 73.3,46 73.3,66 56,76 38.7,66 38.7,46" transform="translate(-56, -56)"/>
    </g>
  </g>
</svg>
