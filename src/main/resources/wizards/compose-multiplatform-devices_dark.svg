<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Compose Multiplatform Icon (Dark)</title>
  <desc>A four-quadrant icon representing Android, iOS, Desktop, and Web platforms, with the Compose logo at the central intersection. Dark theme version.</desc>

  <defs>
    <linearGradient id="compose-gradient" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49C0FF"/>
      <stop offset="1" stop-color="#6C4CFF"/>
    </linearGradient>

    <!-- Shadow filter for dark theme - lighter shadow -->
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="clip">
      <rect x="31" y="31" width="450" height="450" rx="72" ry="72"/>
    </clipPath>

  </defs>

  <!-- Card background with shadow - dark theme -->
  <rect x="31" y="31" width="450" height="450" rx="72" ry="72" fill="#2B2B2B" filter="url(#card-shadow)"/>

  <!-- Background Quadrants - darker colors -->
  <g clip-path="url(#clip)">
    <rect x="31" y="31" width="225" height="225" fill="#1E3A2E"/>
    <rect x="256" y="31" width="225" height="225" fill="#2E2E38"/>
    <rect x="31" y="256" width="225" height="225" fill="#1E2E3A"/>
    <rect x="256" y="256" width="225" height="225" fill="#3A3020"/>
    
    <!-- Dividing Lines inside clip - lighter for dark theme -->
    <line x1="31" y1="256" x2="481" y2="256" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <line x1="256" y1="31" x2="256" y2="481" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
  </g>

  <!-- Platform Icons -->
  <!-- Android -->
  <g>
