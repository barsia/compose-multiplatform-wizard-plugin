        <line x1="1" y1="7" x2="27" y2="7" stroke="#808080" stroke-width="1.4"/>
        <circle cx="6" cy="4" r="1.2" fill="#FF5F56"/>
        <circle cx="10" cy="4" r="1.2" fill="#FFBD2E"/>
        <circle cx="14" cy="4" r="1.2" fill="#27C93F"/>
