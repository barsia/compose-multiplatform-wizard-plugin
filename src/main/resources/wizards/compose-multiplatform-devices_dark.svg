        <path fill="#CCCCCC" d="M23.023 17.093c-0.033-3.259 2.657-4.822 2.777-4.901-1.512-2.211-3.867-2.514-4.705-2.548-2.002-0.204-3.91 1.18-4.926 1.18-1.014 0-2.583-1.15-4.244-1.121-2.185 0.033-4.199 1.271-5.323 3.227-2.269 3.936-0.58 9.769 1.631 12.963 1.081 1.561 2.37 3.318 4.061 3.254 1.63-0.064 2.245-1.055 4.215-1.055s2.524 1.055 4.248 1.021c1.753-0.032 2.864-1.591 3.936-3.159 1.24-1.814 1.751-3.57 1.782-3.659-0.038-0.017-3.416-1.312-3.451-5.202zM19.783 7.53c0.897-1.089 1.504-2.602 1.34-4.108-1.294 0.053-2.861 0.86-3.79 1.948-0.832 0.965-1.561 2.502-1.365 3.981 1.444 0.112 2.916-0.734 3.816-1.821z"/>
    </g>
    <!-- Desktop -->
    <g transform="translate(143.5, 368.5) scale(2.5) translate(-14, -13)">
        <rect x="1" y="1" width="26" height="18" rx="1.5" stroke="#808080" stroke-width="1.4" fill="#1A1A1A"/>
        <path d="M1,19 L1,21 a2,2 0 0 0 2,2 H25 a2,2 0 0 0 2,-2 L27,19 M9,26 L19,26" stroke="#808080" stroke-width="1.4" fill="none"/>
        <line x1="5" y1="5" x2="10" y2="5" stroke="#4CAF50" stroke-width="1.5"/>
        <line x1="5" y1="9" x2="15" y2="9" stroke="#2196F3" stroke-width="1.5"/>
        <line x1="5" y1="13" x2="12" y2="13" stroke="#FFC107" stroke-width="1.5"/>
