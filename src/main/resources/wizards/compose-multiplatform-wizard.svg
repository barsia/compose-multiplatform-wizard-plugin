<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Compose Multiplatform Icon</title>
  <desc>A four-quadrant icon representing Android, iOS, Desktop, and Web platforms, with the Compose logo at the central intersection.</desc>
  
  <defs>
    <linearGradient id="compose-gradient" x1="16" y1="8" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#49C0FF"/>
      <stop offset="1" stop-color="#6C4CFF"/>
    </linearGradient>

    <filter id="background-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <clipPath id="clip">
      <rect x="31" y="31" width="450" height="450" rx="72" ry="72"/>
    </clipPath>
  </defs>

  <!-- Background Quadrants -->
  <g clip-path="url(#clip)" filter="url(#background-shadow)">
    <!-- Top-Left: Android -->
    <rect x="31" y="31" width="225" height="225" fill="#E9F7EF"/>
    <!-- Top-Right: iOS -->
    <rect x="256" y="31" width="225" height="225" fill="#F2F2F7"/>
    <!-- Bottom-Left: Desktop -->
    <rect x="31" y="256" width="225" height="225" fill="#EBF4FA"/>
    <!-- Bottom-Right: Web -->
    <rect x="256" y="256" width="225" height="225" fill="#FFF9EB"/>
  </g>

