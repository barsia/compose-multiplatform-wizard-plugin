  <!-- Central Compose Logo -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="64" fill="#FFFFFF" filter="url(#logo-shadow)"/>
    <g transform="scale(1) translate(-56, -56)">
        <polygon fill="url(#compose-gradient)" points="56,8 97.6,32 97.6,80 56,104 14.4,80 14.4,32"/>
        <polygon fill="#000000" points="56,36 73.3,46 73.3,66 56,76 38.7,66 38.7,46"/>
