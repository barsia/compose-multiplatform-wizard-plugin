<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="compose-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1967D2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg-gradient)" rx="32"/>
  
  <!-- Main container -->
  <g transform="translate(256, 256)">
    
    <!-- Platform icons with modern style -->
    
    <!-- Android (top-left) -->
    <g transform="translate(-100, -100)" filter="url(#shadow)">
      <circle r="45" fill="#3DDC84" opacity="0.95"/>
      <path d="M -10 -15 L -10 5 M 10 -15 L 10 5 M -20 -5 L 20 -5 L 15 15 L -15 15 Z" 
            stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-8" cy="-2" r="2" fill="white"/>
      <circle cx="8" cy="-2" r="2" fill="white"/>
    </g>
    
    <!-- iOS (top-right) -->
    <g transform="translate(100, -100)" filter="url(#shadow)">
      <circle r="45" fill="#555555" opacity="0.95"/>
      <path d="M -10 -8 C -10 -15, -5 -20, 0 -20 C 5 -20, 10 -15, 10 -8 C 10 0, 5 5, 0 5 C -5 5, -10 0, -10 -8 M 5 -23 L 5 -25"
            stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M -10 8 L -10 15 C -10 18, -8 20, -5 20 L 5 20 C 8 20, 10 18, 10 15 L 10 8"
            stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Desktop (bottom-left) -->
    <g transform="translate(-100, 100)" filter="url(#shadow)">
      <circle r="45" fill="#5E97F6" opacity="0.95"/>
      <rect x="-18" y="-12" width="36" height="24" rx="2" 
            stroke="white" stroke-width="3" fill="none"/>
      <path d="M -10 12 L -10 18 L 10 18 L 10 12 M -15 18 L 15 18"
            stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Web (bottom-right) -->
    <g transform="translate(100, 100)" filter="url(#shadow)">
      <circle r="45" fill="#FF6D00" opacity="0.95"/>
      <circle r="16" stroke="white" stroke-width="3" fill="none"/>
      <ellipse rx="8" ry="16" stroke="white" stroke-width="3" fill="none"/>
      <line x1="-16" y1="0" x2="16" y2="0" stroke="white" stroke-width="3"/>
    </g>
    
    <!-- Central Compose logo -->
    <g filter="url(#shadow)">
      <circle r="80" fill="url(#compose-gradient)"/>
      
      <!-- Compose @ symbol -->
      <g transform="scale(1.2)">
        <path d="M 15 0 A 15 15 0 1 1 15 0.1" 
              stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="20" cy="0" r="8" fill="white"/>
      </g>
      
      <!-- Small K for Kotlin -->
      <text x="-8" y="-25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" opacity="0.9">K</text>
    </g>
    
    <!-- Connection lines with gradient -->
    <g stroke="#BDBDBD" stroke-width="2" opacity="0.4" stroke-dasharray="5,5">
      <line x1="-65" y1="-65" x2="-45" y2="-45"/>
      <line x1="65" y1="-65" x2="45" y2="-45"/>
      <line x1="-65" y1="65" x2="-45" y2="45"/>
      <line x1="65" y1="65" x2="45" y2="45"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="600" 
        text-anchor="middle" fill="#424242">
    Compose Multiplatform
  </text>
</svg>
